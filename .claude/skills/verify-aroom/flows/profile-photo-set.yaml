appId: com.jinjinstar.aroom.dev
---
# Starts on any tab after profile-photo-calendar; the simulator library holds the photo `xcrun simctl addmedia` added.
- tapOn: "설정.*"
- tapOn: "검증, .*"
- extendedWaitUntil:
    visible: "프로필 사진 바꾸기"
    timeout: 10000
- tapOn: "프로필 사진 바꾸기"
- tapOn: "사진 고르기"
# The system picker is out of process: its cells are labeled only by date, so tap the added photo by position (second row, middle).
- extendedWaitUntil:
    visible: "사진"
    timeout: 10000
- tapOn:
    point: "50%,61%"
- tapOn: "Choose|선택"
- extendedWaitUntil:
    notVisible: "사진 고르기"
    timeout: 30000
