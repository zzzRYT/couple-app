appId: com.jinjinstar.aroom.dev
---
# Starts after home-dday and `partner --photo`, so "연결됐어요" and the notification pre-prompt may be up first.
- tapOn:
    text: "시작하기"
    optional: true
- tapOn:
    text: "알림 켜기"
    optional: true
- tapOn:
    text: "허용|Allow"
    optional: true
- extendedWaitUntil:
    visible: "달력.*"
    timeout: 20000
- tapOn: "달력.*"
- extendedWaitUntil:
    visible: ".*이케아 장보기.*하루님이 추가.*"
    timeout: 20000
