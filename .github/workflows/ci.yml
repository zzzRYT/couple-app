name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @couple/scene-contract test
      - run: pnpm --filter mobile test
      - run: supabase db start
      - run: supabase test db
      - run: LOCAL_DATABASE_URL="$(supabase status -o json | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).DB_URL))')" node --test tools/tests/quota-concurrency.test.mjs
      - run: deno test --allow-env --allow-read supabase/functions
      - run: node tools/ci/check-schemas.mjs
      - run: node tools/ci/check-migrations.mjs
      - run: node --test assets/catalog/__tests__/manifest.test.mjs tools/tests/font-glyphs.test.mjs
