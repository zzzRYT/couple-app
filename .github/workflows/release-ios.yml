name: Release iOS
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [testflight, production]
        default: testflight
      submit:
        description: Upload to App Store Connect (the profile's record) after a successful build
        type: boolean
        default: true
concurrency:
  group: release-ios
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: '${{ secrets.EXPO_TOKEN }}'
      - name: Check submit configuration
        if: inputs.submit
        env:
          PROFILE: ${{ inputs.profile }}
        run: node -e "const p=process.env.PROFILE;const id=require('./eas.json').submit[p]?.ios?.ascAppId;if(!id||id==='ASC_APP_ID_REQUIRED'){console.error('Set submit.'+p+'.ios.ascAppId in apps/mobile/eas.json (owner step)');process.exit(1)}"
      - name: Build (and submit on success)
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --wait ${{ inputs.submit && format('--auto-submit-with-profile {0}', inputs.profile) || '' }}
