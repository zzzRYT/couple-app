name: Design review comment
on:
  workflow_run:
    workflows: ["Design review"]
    types: [completed]
# One comment job per branch at a time, so two runs never both create the comment.
concurrency:
  group: design-review-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # Trusted default-branch code only. The PR's code is never checked out or run in this job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Extract outside the checkout so artifact contents can never overwrite the trusted scripts.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: design-review
          path: ${{ runner.temp }}/design-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: node .github/scripts/design-review-comment.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESIGN_REVIEW_OUT: ${{ runner.temp }}/design-review/result.json
