name: OTA
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Hot Updater channel (builds from 1.0.1 on; 1.0.0 uses OTA (EAS, 1.0.0))
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Required for preview updates
        type: string
        required: false
      bundle:
        description: Required for production - the checked preview bundle ID to promote
        type: string
        required: false
# Release numbers come from the tags a promotion creates, so runs take turns.
concurrency: ota
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.10.0
          token: '${{ secrets.EXPO_TOKEN }}'
      - name: Validate required input
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
          BUNDLE: ${{ inputs.bundle }}
        run: |
          if [ "$CHANNEL" = preview ] && [ -z "$MESSAGE" ]; then
            echo 'A non-empty message is required for preview OTA updates.' >&2
            exit 1
          fi
          if [ "$CHANNEL" = production ] && [ -z "$BUNDLE" ]; then
            echo 'A non-empty bundle ID is required for production promotion.' >&2
            exit 1
          fi
      # The Cloudflare credentials and the client key live in the EAS preview environment; eas env:exec passes them to the CLI.
      - name: Deploy preview update
        if: inputs.channel == 'preview'
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_APP_VARIANT: preview
          MESSAGE: ${{ inputs.message }}
        # The bundle shows "<version> (<N>)", N being the next production OTA of that version (docs/ota.md#release-numbers).
        run: |
          VERSION=$(npx expo config --json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          N=$(git ls-remote --tags origin "refs/tags/v$VERSION-ota.*" | node ../../.github/scripts/ota-release.mjs next)
          EXPO_PUBLIC_OTA_RELEASE="$VERSION ($N)"
          OTA_MESSAGE=$(node ../../.github/scripts/ota-release.mjs message "$EXPO_PUBLIC_OTA_RELEASE" "$GITHUB_SHA" "$MESSAGE")
          export EXPO_PUBLIC_OTA_RELEASE OTA_MESSAGE
          eas env:exec preview 'npx hot-updater deploy --platform ios --channel preview --message "$OTA_MESSAGE"' --non-interactive
      - name: Read the release number of the preview bundle
        if: inputs.channel == 'production'
        env:
          BUNDLE: ${{ inputs.bundle }}
        run: |
          eas env:exec preview 'npx hot-updater bundle show "$BUNDLE" --json > "$RUNNER_TEMP/bundle.json"' --non-interactive
          node ../../.github/scripts/ota-release.mjs env "$RUNNER_TEMP/bundle.json" >> "$GITHUB_ENV"
      - name: Promote checked preview bundle to production
        if: inputs.channel == 'production'
        env:
          BUNDLE: ${{ inputs.bundle }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$OTA_TAG" > /dev/null; then
            echo "$OTA_TITLE is already in production ($OTA_TAG). Deploy a new preview bundle; it gets the next number." >&2
            exit 1
          fi
          eas env:exec preview 'npx hot-updater bundle promote "$BUNDLE" --target production --action copy --yes' --non-interactive
          gh release create "$OTA_TAG" --target "$OTA_SHA" --title "$OTA_TITLE" --notes "Hot Updater bundle $BUNDLE, promoted to production."
