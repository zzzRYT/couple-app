name: OTA
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Hot Updater channel (builds from 1.0.1 on; 1.0.0 uses OTA (EAS, 1.0.0))
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: Required for preview updates
        type: string
        required: false
      bundle:
        description: Required for production - the checked preview bundle ID to promote
        type: string
        required: false
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: '${{ secrets.EXPO_TOKEN }}'
      - name: Validate required input
        env:
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
          BUNDLE: ${{ inputs.bundle }}
        run: |
          if [ "$CHANNEL" = preview ] && [ -z "$MESSAGE" ]; then
            echo 'A non-empty message is required for preview OTA updates.' >&2
            exit 1
          fi
          if [ "$CHANNEL" = production ] && [ -z "$BUNDLE" ]; then
            echo 'A non-empty bundle ID is required for production promotion.' >&2
            exit 1
          fi
      # The Cloudflare credentials and the client key live in the EAS preview environment; eas env:exec passes them to the CLI.
      - name: Deploy preview update
        if: inputs.channel == 'preview'
        env:
          APP_VARIANT: preview
          EXPO_PUBLIC_APP_VARIANT: preview
          MESSAGE: ${{ inputs.message }}
        run: eas env:exec preview 'npx hot-updater deploy --platform ios --channel preview --message "$MESSAGE"' --non-interactive
      - name: Promote checked preview bundle to production
        if: inputs.channel == 'production'
        env:
          BUNDLE: ${{ inputs.bundle }}
        run: eas env:exec preview 'npx hot-updater bundle promote "$BUNDLE" --target production --action copy --yes' --non-interactive
