name: Design review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
# A newer run for the same PR supersedes this one; the comment job skips cancelled runs.
concurrency:
  group: design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: node .github/scripts/design-review-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-review
          path: design-review/result.json
          retention-days: 7
